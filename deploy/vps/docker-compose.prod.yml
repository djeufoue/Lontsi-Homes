services:
  caddy:
    image: caddy:2.10-alpine
    container_name: lontsihomes-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      portal:
        condition: service_started
      api:
        condition: service_healthy
    networks:
      - lontsihomes

  portal:
    build:
      context: ../..
      dockerfile: LontsiHomes.Portal/Dockerfile
    container_name: lontsihomes-portal
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: http://api:8080/api/
      DataProtection__KeysPath: /var/aspnet/data-protection-keys
      Onboarding__RequireMainPhoneVerification: ${REQUIRE_MAIN_PHONE_VERIFICATION:-false}
      PublicSite__SiteName: ${PUBLIC_SITE_NAME}
      PublicSite__LegalEntityName: ${PUBLIC_SITE_LEGAL_ENTITY_NAME}
      PublicSite__SupportEmail: ${PUBLIC_SITE_SUPPORT_EMAIL}
      PublicSite__RefundEmail: ${PUBLIC_SITE_REFUND_EMAIL}
      PublicSite__SupportPhone: ${PUBLIC_SITE_SUPPORT_PHONE}
      PublicSite__SupportWhatsApp: ${PUBLIC_SITE_SUPPORT_WHATSAPP}
      PublicSite__CompanyAddress: ${PUBLIC_SITE_COMPANY_ADDRESS}
      Subscriptions__UsdToXafRate: ${SUBSCRIPTIONS_USD_TO_XAF_RATE}
    volumes:
      - portal_keys:/var/aspnet/data-protection-keys
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - lontsihomes

  api:
    build:
      context: ../..
      dockerfile: LontsiHomes.API/Dockerfile
    container_name: lontsihomes-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=${SQL_DATABASE};User ID=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      JwtSettings__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      JwtSettings__SigningKey: ${JWT_SIGNING_KEY}
      AzureStorage__ConnectionString: ${AZURE_STORAGE_CONNECTION_STRING}
      AzureStorage__ContainerName: ${AZURE_STORAGE_CONTAINER}
      Portal__BaseUrl: https://${PORTAL_DOMAIN}
      DataProtection__KeysPath: /var/aspnet/data-protection-keys
      Onboarding__RequireMainPhoneVerification: ${REQUIRE_MAIN_PHONE_VERIFICATION:-false}
      Infobip__ReceiptMediaBaseUrl: https://${API_DOMAIN}
      Infobip__UrlButtonParameters__landlord_rent_payment_received: ${WHATSAPP_BUTTON_LANDLORD_RECEIPT:-}
      Infobip__UrlButtonParameters__rent_due_soon: ${WHATSAPP_BUTTON_RENT_DUE_SOON:-}
      Infobip__UrlButtonParameters__rent_due_today: ${WHATSAPP_BUTTON_RENT_DUE_TODAY:-}
      Infobip__UrlButtonParameters__rent_overdue: ${WHATSAPP_BUTTON_RENT_OVERDUE:-}
      Infobip__UrlButtonParameters__tenancy_ending_soon: ${WHATSAPP_BUTTON_TENANCY_ENDING:-}
      Maps__GoogleGeocodingApiKey: ${GOOGLE_GEOCODING_API_KEY}
      Infobip__BaseUrl: ${INFOBIP_BASE_URL:-https://api.infobip.com}
      Infobip__ApiKey: ${INFOBIP_API_KEY:?Set the production Infobip API key}
      Infobip__SmsSender: ${INFOBIP_SMS_SENDER}
      Infobip__WhatsAppSender: ${INFOBIP_WHATSAPP_SENDER:?Set the approved WhatsApp sender}
      Infobip__WebhookSecret: ${INFOBIP_WEBHOOK_SECRET:?Set a random production webhook secret}
      Email__Smtp__Host: ${EMAIL_SMTP_HOST}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT}
      Email__Smtp__Username: ${EMAIL_SMTP_USERNAME}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD}
      Email__Smtp__From: ${EMAIL_SMTP_FROM}
      Email__Smtp__FromName: ${EMAIL_SMTP_FROM_NAME}
      Email__Smtp__UseSsl: ${EMAIL_SMTP_USE_SSL}
      Notifications__KycAdminEmail: ${NOTIFICATIONS_KYC_ADMIN_EMAIL}
      AdminNotifications__KycEmail: ${ADMIN_NOTIFICATIONS_KYC_EMAIL}
      NotchPay__BaseUrl: ${NOTCHPAY_BASE_URL}
      NotchPay__ApiKey: ${NOTCHPAY_API_KEY}
      NotchPay__WebhookSecret: ${NOTCHPAY_WEBHOOK_SECRET}
      CamPay__BaseUrl: ${CAMPAY_BASE_URL}
      CamPay__AppUsername: ${CAMPAY_APP_USERNAME}
      CamPay__AppPassword: ${CAMPAY_APP_PASSWORD}
      CamPay__WebhookKey: ${CAMPAY_WEBHOOK_KEY}
      Subscriptions__UsdToXafRate: ${SUBSCRIPTIONS_USD_TO_XAF_RATE}
      Stripe__BaseUrl: ${STRIPE_BASE_URL}
      Stripe__Currency: ${STRIPE_CURRENCY}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      Stripe__Connect__Enabled: ${STRIPE_CONNECT_ENABLED}
      Stripe__Connect__RequirePayoutSetup: ${STRIPE_CONNECT_REQUIRE_PAYOUT_SETUP}
      Stripe__Connect__DefaultCountry: ${STRIPE_CONNECT_DEFAULT_COUNTRY}
      Stripe__Connect__BusinessProfileUrl: ${STRIPE_CONNECT_BUSINESS_PROFILE_URL}
      AdminSeed__Enabled: ${ADMIN_SEED_ENABLED:-false}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD}
      AdminSeed__FullName: ${ADMIN_SEED_FULL_NAME}
      AdminSeed__CountryCode: ${ADMIN_SEED_COUNTRY_CODE}
      ReminderSettings__DaysBeforeDue: ${REMINDER_DAYS_BEFORE_DUE}
      ReminderSettings__DaysAfterUnpaid: ${REMINDER_DAYS_AFTER_UNPAID}
    volumes:
      - api_keys:/var/aspnet/data-protection-keys
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    expose:
      - "8080"
    networks:
      - lontsihomes

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lontsihomes-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: 2048
    volumes:
      - sqlserver_data:/var/opt/mssql
      - sqlserver_backup:/var/opt/mssql/backup
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    expose:
      - "1433"
    ports:
      - "127.0.0.1:1433:1433"
    networks:
      - lontsihomes

networks:
  lontsihomes:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  portal_keys:
  api_keys:
  sqlserver_data:
  sqlserver_backup:
